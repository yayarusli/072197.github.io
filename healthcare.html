<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Healthcare Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap');

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #fdf6f8;
      color: #333;
    }

    h2 {
      color: #800020;
      font-weight: 600;
    }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(128, 0, 32, 0.1);
      margin-bottom: 30px;
    }

    .card-title {
      color: #800020;
      font-weight: 600;
    }

    canvas {
      max-width: 100%;
      max-height: 300px;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <h2 class="text-center mb-4">🏥 Healthcare Statistics (Live)</h2>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title text-center">COVID-19 Cases in Malaysia</h5>
        <canvas id="covidChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title text-center">Dengue Cases in Malaysia</h5>
        <canvas id="dengueChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // COVID-19 Chart
    const covidCtx = document.getElementById('covidChart').getContext('2d');
    new Chart(covidCtx, {
      type: 'bar',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          label: 'New COVID-19 Cases',
          data: [120, 150, 90, 130, 170, 200, 180],
          backgroundColor: '#800020'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    // Dengue Chart
    const dengueCtx = document.getElementById('dengueChart').getContext('2d');
    new Chart(dengueCtx, {
      type: 'line',
      data: {
        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
        datasets: [{
          label: 'Dengue Cases',
          data: [80, 100, 75, 110],
          borderColor: '#800020',
          backgroundColor: 'rgba(128, 0, 32, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  </script>

</body>
</html>
