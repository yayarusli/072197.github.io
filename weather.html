<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap');

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #fdf6f8;
      color: #333;
    }

    h2, h5 {
      color: #800020;
    }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(128, 0, 32, 0.1);
    }

    .card-title {
      font-weight: 600;
    }

    #temperature, #condition, #humidity, #wind {
      color: #800020;
      font-weight: 600;
    }

    canvas {
      max-width: 100%;
      max-height: 300px;
    }

    .hidden {
      display: none;
    }

    .weather-icon {
      width: 60px;
      height: 60px;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <!-- Search -->
    <div class="text-center mb-4">
      <h2 class="mb-3">🌦️ Weather Dashboard</h2>
      <input type="text" id="cityInput" class="form-control d-inline-block w-50" placeholder="Enter city name (e.g. Tokyo)">
      <button class="btn btn-primary mt-2" onclick="searchWeather()">Search</button>
    </div>

    <!-- Weather Info -->
    <div id="weatherSection" class="hidden">
      <h4 class="text-center mb-3" id="cityTitle"></h4>
      <div class="card mb-4 shadow-sm">
        <div class="card-body text-center">
          <img id="weatherIcon" class="weather-icon mb-2" src="" alt="Weather Icon">
          <p class="mb-1">Temperature: <strong><span id="temperature"></span></strong></p>
          <p class="mb-1">Condition: <strong><span id="condition"></span></strong></p>
          <p class="mb-1">Humidity: <strong><span id="humidity"></span></strong></p>
          <p class="mb-0">Wind Speed: <strong><span id="wind"></span></strong></p>
        </div>
      </div>

      <!-- Chart -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title text-center">Live Temperature Updates</h5>
          <div style="max-height: 300px;">
            <canvas id="tempChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "4413dbd78ad72df87c86110a6358db1d";
    let tempChart;
    let currentCity = "";
    let updateInterval;

    function buildURL(city) {
      return `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`;
    }

    function updateChart(temp) {
      const timeNow = new Date().toLocaleTimeString();

      if (!tempChart) {
        const ctx = document.getElementById('tempChart').getContext('2d');
        tempChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: [timeNow],
            datasets: [{
              label: 'Temperature (°C)',
              data: [temp],
              borderColor: '#800020',
              backgroundColor: 'rgba(128, 0, 32, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: false }
            }
          }
        });
      } else {
        tempChart.data.labels.push(timeNow);
        tempChart.data.datasets[0].data.push(temp);
        if (tempChart.data.labels.length > 10) {
          tempChart.data.labels.shift();
          tempChart.data.datasets[0].data.shift();
        }
        tempChart.update();
      }
    }

    function fetchWeather(city) {
      fetch(buildURL(city))
        .then(res => {
          if (!res.ok) throw new Error("City not found");
          return res.json();
        })
        .then(data => {
          const temp = data.main.temp;
          const condition = data.weather[0].description;
          const humidity = data.main.humidity;
          const wind = data.wind.speed;
          const iconCode = data.weather[0].icon;
          const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

          document.getElementById("temperature").textContent = `${temp}°C`;
          document.getElementById("condition").textContent = condition;
          document.getElementById("humidity").textContent = `${humidity}%`;
          document.getElementById("wind").textContent = `${wind} m/s`;
          document.getElementById("cityTitle").textContent = `Weather in ${data.name}, ${data.sys.country}`;
          document.getElementById("weatherIcon").src = iconUrl;
          document.getElementById("weatherSection").classList.remove("hidden");

          updateChart(temp);
        })
        .catch(error => {
          alert("⚠️ " + error.message);
        });
    }

    function searchWeather() {
      const city = document.getElementById("cityInput").value.trim();
      if (!city) return alert("Please enter a city name.");

      currentCity = city;

      // Reset chart
      if (tempChart) {
        tempChart.destroy();
        tempChart = null;
      }

      // Clear previous interval
      if (updateInterval) {
        clearInterval(updateInterval);
      }

      // Fetch data
      fetchWeather(currentCity);

      // Set auto update
      updateInterval = setInterval(() => {
        fetchWeather(currentCity);
      }, 10000);
    }
  </script>

</body>
</html>
