<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap');

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #fdf6f8;
      color: #333;
    }

    h2, h5 {
      color: #800020;
    }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(128, 0, 32, 0.1);
    }

    .card-title {
      font-weight: 600;
    }

    #temperature, #condition {
      color: #800020;
      font-weight: 600;
    }

    canvas {
      max-width: 100%;
      max-height: 300px;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <!-- Search Box -->
    <div class="text-center mb-4">
      <input type="text" id="cityInput" class="form-control d-inline-block w-50" placeholder="Enter city name (e.g. Tokyo)">
      <button class="btn btn-primary mt-2" onclick="changeCity()">Search</button>
    </div>

    <h2 class="text-center mb-4" id="cityTitle">🌦️ Weather in Kuala Lumpur</h2>

    <!-- Weather Info -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body text-center">
        <p class="mb-1">Temperature: <strong><span id="temperature">Loading...</span></strong></p>
        <p class="mb-0">Condition: <strong><span id="condition">Loading...</span></strong></p>
      </div>
    </div>

    <!-- Chart -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title text-center">Live Temperature Updates</h5>
        <div style="max-height: 300px;">
          <canvas id="tempChart" style="max-height: 300px;"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "4413dbd78ad72df87c86110a6358db1d";
    let tempChart;
    let currentCity = "Kuala Lumpur";

    function buildURL(city) {
      return `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`;
    }

    function updateChart(temp) {
      const timeNow = new Date().toLocaleTimeString();

      if (!tempChart) {
        const ctx = document.getElementById('tempChart').getContext('2d');
        tempChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: [timeNow],
            datasets: [{
              label: 'Temperature (°C)',
              data: [temp],
              borderColor: '#800020',
              backgroundColor: 'rgba(128, 0, 32, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: false }
            }
          }
        });
      } else {
        tempChart.data.labels.push(timeNow);
        tempChart.data.datasets[0].data.push(temp);
        if (tempChart.data.labels.length > 10) {
          tempChart.data.labels.shift();
          tempChart.data.datasets[0].data.shift();
        }
        tempChart.update();
      }
    }

    function fetchWeather(city) {
      fetch(buildURL(city))
        .then(res => {
          if (!res.ok) throw new Error("City not found");
          return res.json();
        })
        .then(data => {
          const temp = data.main.temp;
          const condition = data.weather[0].description;

          document.getElementById("temperature").textContent = `${temp}°C`;
          document.getElementById("condition").textContent = condition;
          document.getElementById("cityTitle").textContent = `🌦️ Weather in ${data.name}`;

          updateChart(temp);
        })
        .catch(error => {
          alert("⚠️ Error: " + error.message);
        });
    }

    function changeCity() {
      const input = document.getElementById("cityInput").value.trim();
      if (input) {
        currentCity = input;
        if (tempChart) {
          tempChart.destroy();
          tempChart = null;
        }
        fetchWeather(currentCity);
      }
    }

    // Initial fetch
    fetchWeather(currentCity);

    // Auto update every 10 seconds for the selected city
    setInterval(() => {
      fetchWeather(currentCity);
    }, 10000);
  </script>

</body>
</html>
