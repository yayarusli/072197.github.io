<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap');

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #fdf6f8;
      color: #333;
    }

    h2, h5 {
      color: #800020;
    }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(128, 0, 32, 0.1);
    }

    .card-title {
      font-weight: 600;
    }

    #temperature, #condition {
      color: #800020;
      font-weight: 600;
    }

    canvas {
      max-width: 100%;
      max-height: 300px;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <h2 class="text-center mb-4">🌦️ Weather in Kuala Lumpur</h2>

    <!-- Weather Info -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body text-center">
        <p class="mb-1">Temperature: <strong><span id="temperature">Loading...</span></strong></p>
        <p class="mb-0">Condition: <strong><span id="condition">Loading...</span></strong></p>
      </div>
    </div>

    <!-- Chart -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title text-center">Live Temperature Updates</h5>
        <div style="max-height: 300px;">
          <canvas id="tempChart" style="max-height: 300px;"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "4413dbd78ad72df87c86110a6358db1d";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=Kuala+Lumpur&units=metric&appid=${API_KEY}`;

    let tempChart;

    function updateChart(temp) {
      const timeNow = new Date().toLocaleTimeString();

      if (!tempChart) {
        const ctx = document.getElementById('tempChart').getContext('2d');
        tempChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: [timeNow],
            datasets: [{
              label: 'Temperature (°C)',
              data: [temp],
              borderColor: '#800020',
              backgroundColor: 'rgba(128, 0, 32, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: false }
            }
          }
        });
      } else {
        tempChart.data.labels.push(timeNow);
        tempChart.data.datasets[0].data.push(temp);
        if (tempChart.data.labels.length > 10) {
          tempChart.data.labels.shift();
          tempChart.data.datasets[0].data.shift();
        }
        tempChart.update();
      }
    }

    function fetchWeather() {
      fetch(url)
        .then(res => res.json())
        .then(data => {
          const temp = data.main.temp;
          const condition = data.weather[0].description;

          document.getElementById("temperature").textContent = `${temp}°C`;
          document.getElementById("condition").textContent = condition;

          updateChart(temp);
        })
        .catch(error => {
          console.error("Error fetching weather data:", error);
        });
    }

    fetchWeather();
    setInterval(fetchWeather, 10000);
  </script>

</body>
</html>
