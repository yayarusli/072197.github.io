<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
    }

    h2 {
      color: #333;
    }

    .card {
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: none;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .card-text {
      font-size: 0.95rem;
    }

    .news-img {
      max-height: 150px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <h2 class="text-center mb-4">📰 News Dashboard</h2>

    <!-- Search -->
    <div class="input-group mb-4 w-75 mx-auto">
      <input type="text" id="newsKeyword" class="form-control" placeholder="Search for news (e.g. technology, sports)">
      <button class="btn btn-primary" onclick="searchNews()">Search</button>
    </div>

    <!-- News Results -->
    <div id="newsContainer" class="row"></div>
  </div>

  <script src="script2.js"></script>
</body>
</html>
